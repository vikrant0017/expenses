name: CI

on:
  pull_request:
    branches: [main]

jobs:
  style:
    name: Style
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup UV
        uses: astral-sh/setup-uv@v7

      - name: Check formatting
        run: uv run --frozen ruff format --check
        working-directory: backend

      - name: Check linting
        run: uv run --frozen ruff check
        working-directory: backend
